<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#EEF1EE">
<title>가계부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --paper:#FFFFFF; --ink:#1C2530; --muted:#6B7682; --line:#D9DED9;
  --mini:#3B6CB0; --sugar:#D4758C; --other:#9AA3AC;
  --good:#2F7D55; --bad:#B8433A; --focus:#3B6CB0;
  --radius-lg:22px; --radius-sm:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171C; --paper:#1B2229; --ink:#E6EAEE; --muted:#93A0AC; --line:#2A333C;
    --mini:#6F9BD8; --sugar:#E892A6; --other:#6B7682; --good:#58B283; --bad:#E07A70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171C; --paper:#1B2229; --ink:#E6EAEE; --muted:#93A0AC; --line:#2A333C;
  --mini:#6F9BD8; --sugar:#E892A6; --other:#6B7682; --good:#58B283; --bad:#E07A70;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size:16px; line-height:1.5; font-variant-numeric: tabular-nums;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
.wrap{ max-width:560px; margin:0 auto; padding:12px 16px 48px; }

/* 상단: 월 이동 */
.top{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0 4px; }
.month{ font-size:1.125rem; font-weight:600; }
.iconbtn{ width:40px; height:40px; border-radius:50%; border:0; background:transparent; cursor:pointer; font-size:1.25rem; display:grid; place-items:center; }
.iconbtn:hover{ background:var(--line); }
.iconbtn[disabled]{ opacity:.3; cursor:default; background:transparent; }
.monthnav{ display:flex; align-items:center; gap:2px; }

/* 핵심: 이번 달 합계와 두 사람의 몫 */
.hero{ padding:18px 2px 8px; }
.total{ font-size:clamp(2.4rem, 11vw, 3.2rem); font-weight:700; letter-spacing:-.02em; line-height:1.1; }
.total small{ font-size:.45em; font-weight:500; margin-left:4px; color:var(--muted); }
.delta{ margin-top:6px; color:var(--muted); font-size:.9rem; }
.delta b{ font-weight:600; }
.delta .up{ color:var(--bad); } .delta .down{ color:var(--good); }
.split{ display:flex; height:14px; border-radius:7px; overflow:hidden; margin:18px 0 10px; background:var(--line); }
.split span{ display:block; height:100%; transition:width .5s ease; }
.who{ display:flex; gap:18px; flex-wrap:wrap; }
.who button{ border:0; background:transparent; padding:4px 0; cursor:pointer; text-align:left; }
.who .name{ display:flex; align-items:center; gap:6px; font-size:.9rem; color:var(--muted); }
.who .dot{ width:10px; height:10px; border-radius:50%; }
.who .amt{ font-size:1.15rem; font-weight:600; }
.who button[aria-pressed="true"] .name{ color:var(--ink); font-weight:600; }

section{ margin-top:28px; }
h2{ font-size:1rem; font-weight:600; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
h2 .aside{ font-size:.85rem; font-weight:400; color:var(--muted); }

/* 분류별 */
.cats{ background:var(--paper); border-radius:var(--radius-lg); padding:6px 14px; }
.cat{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:11px 0; border-bottom:1px solid var(--line); width:100%; border-left:0; border-right:0; border-top:0; background:transparent; text-align:left; cursor:pointer; }
.cat:last-child{ border-bottom:0; }
.cat .n{ font-weight:500; }
.cat .v{ font-weight:600; text-align:right; }
.cat .bar{ grid-column:1 / -1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; display:flex; }
.cat .bar i{ display:block; height:100%; }
.cat .sub{ grid-column:1 / -1; font-size:.8rem; color:var(--muted); }
.cat[aria-pressed="true"] .n{ text-decoration:underline; text-underline-offset:3px; }

/* 6개월 추이 */
.trend{ background:var(--paper); border-radius:var(--radius-lg); padding:16px 14px 10px; }
.trend svg{ width:100%; height:auto; display:block; }
.trend text{ fill:var(--muted); font-size:11px; font-family:inherit; }
.trend .cur{ fill:var(--ink); font-weight:600; }

/* 내역 */
.filters{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; }
.chip{ flex:none; border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 12px; font-size:.85rem; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.list{ background:var(--paper); border-radius:var(--radius-lg); overflow:hidden; }
.day{ padding:12px 14px 4px; font-size:.8rem; color:var(--muted); }
.tx{ display:grid; grid-template-columns:4px 1fr auto; gap:0 12px; align-items:center; width:100%; padding:10px 14px; border:0; background:transparent; text-align:left; cursor:pointer; }
.tx:hover{ background:color-mix(in srgb, var(--line) 45%, transparent); }
.tx .mark{ align-self:stretch; border-radius:2px; }
.tx .m{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx .meta{ font-size:.8rem; color:var(--muted); }
.tx .a{ font-weight:600; text-align:right; white-space:nowrap; }
.tx.cancel .m, .tx.cancel .a{ text-decoration:line-through; color:var(--muted); }
.tag{ display:inline-block; font-size:.72rem; padding:0 6px; border-radius:6px; background:var(--bg); color:var(--muted); margin-left:4px; }
.tag.warn{ background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
.empty{ padding:28px 16px; text-align:center; color:var(--muted); }

/* 상세 시트 */
dialog{ border:0; padding:0; width:100%; max-width:560px; margin:auto auto 0; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--paper); color:var(--ink); max-height:88vh; }
dialog::backdrop{ background:rgba(10,15,20,.45); }
.sheet{ padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px)); overflow-y:auto; max-height:88vh; }
.sheet header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.sheet h3{ margin:0; font-size:1.2rem; }
.sheet .big{ font-size:1.8rem; font-weight:700; margin:6px 0 12px; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:.9rem; margin:0; }
.kv dt{ color:var(--muted); } .kv dd{ margin:0; }
.items{ width:100%; border-collapse:collapse; margin-top:16px; font-size:.9rem; }
.items td{ padding:7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
.items td:last-child{ text-align:right; white-space:nowrap; padding-left:10px; }
.items .c{ font-size:.75rem; color:var(--muted); display:block; }
.imgbtn{ margin-top:16px; width:100%; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg); cursor:pointer; }
.receipt{ margin-top:12px; max-width:100%; border-radius:var(--radius-sm); display:block; }
.smsraw{ white-space:pre-wrap; font-size:.85rem; background:var(--bg); border-radius:var(--radius-sm); padding:10px 12px; margin-top:14px; }

/* 로그인 / 상태 */
.gate{ max-width:420px; margin:18vh auto 0; padding:0 20px; }
.gate h1{ font-size:1.5rem; margin:0 0 8px; }
.gate p{ color:var(--muted); margin:0 0 16px; }
.gate input{ width:100%; font:inherit; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--paper); color:var(--ink); }
.primary{ margin-top:12px; width:100%; padding:12px; border-radius:var(--radius-sm); border:0; background:var(--ink); color:var(--paper); font-weight:600; cursor:pointer; }
.status{ text-align:center; color:var(--muted); padding:40vh 20px 0; }
.foot{ margin-top:28px; font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; gap:12px; }
.foot button{ border:0; background:transparent; color:var(--muted); text-decoration:underline; cursor:pointer; padding:0; font-size:inherit; }
/* 영수증 올리기 */
.addbtn{ border:0; background:var(--ink); color:var(--paper); border-radius:999px; padding:8px 14px; font-weight:600; font-size:.9rem; cursor:pointer; }
.topright{ display:flex; align-items:center; gap:4px; }
.up-drop{ display:block; border:1.5px dashed var(--line); border-radius:var(--radius-lg); padding:22px 16px; text-align:center; color:var(--muted); cursor:pointer; margin-top:14px; }
.up-drop img{ max-width:100%; max-height:46vh; border-radius:var(--radius-sm); display:block; margin:0 auto; }
.up-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.up-row label{ font-size:.85rem; color:var(--muted); margin-right:4px; }
.up-memo{ width:100%; font:inherit; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-top:12px; }
.up-msg{ margin-top:10px; font-size:.9rem; color:var(--muted); min-height:1.4em; }
.pending{ background:var(--paper); border-radius:var(--radius-lg); padding:12px 14px; margin-top:16px; font-size:.9rem; }
.pending b{ font-weight:600; }
.pending .fail{ color:var(--bad); margin-top:6px; font-size:.85rem; }
/* 탭 */
.tabs{ display:flex; gap:4px; background:var(--paper); border-radius:999px; padding:4px; margin:8px 0 0; }
.tabs button{ flex:1; border:0; background:transparent; border-radius:999px; padding:8px 0; font-weight:500; cursor:pointer; color:var(--muted); }
.tabs button[aria-selected="true"]{ background:var(--ink); color:var(--paper); }
/* 카드 요약 */
.chero{ padding:18px 2px 4px; }
.chero .l{ font-size:.9rem; color:var(--muted); }
.chero .sub2{ margin-top:6px; color:var(--muted); font-size:.9rem; }
.cchart{ background:var(--paper); border-radius:var(--radius-lg); padding:14px 16px; margin-top:14px; }
.crow{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:8px 0; border-bottom:1px solid var(--line); width:100%; border-left:0; border-right:0; border-top:0; background:transparent; text-align:left; cursor:pointer; }
.crow:last-child{ border-bottom:0; }
.crow .n{ font-weight:500; display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.crow .v{ font-weight:600; text-align:right; white-space:nowrap; }
.crow .bar{ grid-column:1 / -1; height:10px; border-radius:5px; background:var(--line); display:flex; overflow:hidden; }
.crow .bar i{ display:block; height:100%; }
.crow .d{ grid-column:1 / -1; font-size:.78rem; color:var(--muted); }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:8px; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
/* 카드 */
.card{ background:var(--paper); border-radius:var(--radius-lg); padding:16px; margin-top:14px; }
.card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card .nm{ font-weight:600; font-size:1.05rem; }
.card .sub{ font-size:.8rem; color:var(--muted); }
.card .edit{ flex:none; white-space:nowrap; border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 12px; font-size:.8rem; cursor:pointer; }
.bill{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:12px 0 0; margin-top:12px; border-top:1px solid var(--line); width:100%; border-left:0; border-right:0; border-bottom:0; background:transparent; text-align:left; cursor:pointer; }
.bill .l{ font-size:.85rem; color:var(--muted); }
.bill .v{ font-size:1.35rem; font-weight:700; text-align:right; }
.bill .p{ grid-column:1 / -1; font-size:.8rem; color:var(--muted); }
.bill.now .v{ font-size:1.05rem; font-weight:600; color:var(--muted); }
.unk{ font-size:.85rem; color:var(--muted); margin-top:14px; }
.unk button{ margin:6px 6px 0 0; }
.form{ display:grid; gap:14px; margin-top:14px; }
.form label{ display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
.form input[type=text], .form select{ font:inherit; padding:9px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg); color:var(--ink); }
.form input[type=text]{ width:100%; }
.form .line{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.form .keys label{ display:flex; gap:8px; align-items:center; color:var(--ink); font-size:.9rem; margin:4px 0; }
.form .hint{ font-size:.8rem; color:var(--muted); }
.danger{ margin-top:8px; width:100%; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--bad); color:var(--bad); background:transparent; cursor:pointer; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<body>
<div id="app"><p class="status">불러오는 중</p></div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
// ---------------------------------------------------------------- 설정
const OWNER = "SungminKo-smko", REPO = "ledger", BRANCH = "main";
const TOKEN_KEY = "ledger.token";
const PAYERS = [
  { name: "미니", color: "var(--mini)" },
  { name: "슈가", color: "var(--sugar)" },
];
const won = n => (Math.round(n) || 0).toLocaleString("ko-KR");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// ---------------------------------------------------------------- 토큰: #t=... 로 들어오면 저장하고 주소에서 지움
function takeToken() {
  const m = location.hash.match(/(?:^#|&)t=([^&]+)/);
  if (m) {
    try { localStorage.setItem(TOKEN_KEY, decodeURIComponent(m[1])); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
}
function forgetToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

// ---------------------------------------------------------------- GitHub API (private repo 원본 파일)
async function gh(path, as = "text") {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${BRANCH}`;
  const r = await fetch(url, { headers: { Authorization: `Bearer ${state.token}`, Accept: "application/vnd.github.raw" }, cache: "no-store" });
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { status: r.status });
  if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status });
  return as === "blob" ? r.blob() : r.text();
}

// 따옴표·쉼표·줄바꿈을 처리하는 CSV 파서
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}

// ---------------------------------------------------------------- 상태
const state = { token: null, tx: [], items: [], month: null, payer: null, cat: null, loadedAt: null, inbox: { pending: 0, failed: [] }, view: "ledger", cards: [], cardsSha: null };
const ym = d => d.slice(0, 7);
const monthLabel = m => `${m.slice(0, 4)}년 ${Number(m.slice(5, 7))}월`;
function shiftMonth(m, k) { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + k, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };

async function load() {
  $("#app").innerHTML = `<p class="status">불러오는 중</p>`;
  try {
    const [a, b] = await Promise.all([gh("ledger.csv"), gh("ledger_items.csv").catch(() => "")]);
    state.tx = parseCSV(a).map(r => ({ ...r, total: Number(r.total) || 0, cancelled: r.status === "cancelled" }));
    state.items = b ? parseCSV(b).map(r => ({ ...r, net: Number(r.net) || 0, amount: Number(r.amount) || 0 })) : [];
    state.inbox = await loadInbox();
    await loadCards();
    state.loadedAt = new Date();
    if (!state.month) {
      const months = state.tx.map(t => ym(t.date)).sort();
      state.month = months.includes(thisMonth()) || !months.length ? thisMonth() : months[months.length - 1];
    }
    render();
  } catch (e) {
    if (e.message === "auth") { forgetToken(); state.token = null; gate("토큰이 맞지 않거나 만료됐어요. 새 토큰을 넣어 주세요."); }
    else $("#app").innerHTML = `<p class="status">가계부를 불러오지 못했어요 (${esc(e.message)}).<br><button class="primary" style="max-width:200px" onclick="load()">다시 불러오기</button></p>`;
  }
}

// ---------------------------------------------------------------- 로그인 화면
function gate(msg) {
  $("#app").innerHTML = `
  <div class="gate">
    <h1>가계부</h1>
    <p>${esc(msg || "이 기기에서 처음 열었어요. GitHub 토큰을 넣으면 이 기기에 저장되고, 다음부터는 바로 열립니다.")}</p>
    <label for="tok" class="sr">GitHub 토큰</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <button class="primary" id="go">가계부 열기</button>
  </div>`;
  $("#go").onclick = () => {
    const v = $("#tok").value.trim(); if (!v) return;
    try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {}
    state.token = v; load();
  };
}

// ---------------------------------------------------------------- 화면
function render() {
  const m = state.month;
  const inMonth = t => ym(t.date) === m;
  const live = state.tx.filter(t => inMonth(t) && !t.cancelled);
  const prev = state.tx.filter(t => ym(t.date) === shiftMonth(m, -1) && !t.cancelled);
  const sum = a => a.reduce((s, t) => s + t.total, 0);
  const total = sum(live), prevTotal = sum(prev);
  const byPayer = PAYERS.map(p => ({ ...p, v: sum(live.filter(t => t.payer === p.name)) }));
  const otherV = total - byPayer.reduce((s, p) => s + p.v, 0);

  // 분류별: 품목 순금액 기준 (선택한 결제자만)
  const monthItems = state.items.filter(i => ym(i.date) === m && (!state.payer || i.payer === state.payer));
  const cats = {};
  for (const i of monthItems) {
    const c = i.category || "기타";
    (cats[c] ||= { v: 0, subs: {}, byPayer: {} });
    cats[c].v += i.net;
    cats[c].subs[i.subcategory || "-"] = (cats[c].subs[i.subcategory || "-"] || 0) + i.net;
    cats[c].byPayer[i.payer] = (cats[c].byPayer[i.payer] || 0) + i.net;
  }
  const catList = Object.entries(cats).sort((a, b) => b[1].v - a[1].v);
  const catMax = Math.max(1, ...catList.map(c => c[1].v));

  // 내역 목록
  let list = state.tx.filter(inMonth);
  if (state.payer) list = list.filter(t => t.payer === state.payer);
  if (state.cat) {
    const ids = new Set(monthItems.filter(i => (i.category || "기타") === state.cat).map(i => i.id));
    list = list.filter(t => ids.has(t.id));
  }
  list.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const needFix = state.tx.filter(t => inMonth(t) && !t.cancelled && t.category === "기타").length;

  const d = prevTotal ? total - prevTotal : null;

  let out = "", lastDay = "";
  for (const t of list) {
    if (t.date !== lastDay) {
      const dt = new Date(t.date + "T00:00:00");
      out += `<div class="day">${dt.getMonth() + 1}월 ${dt.getDate()}일 ${wd[dt.getDay()]}요일</div>`;
      lastDay = t.date;
    }
    const p = PAYERS.find(p => p.name === t.payer);

    out += `<button class="tx ${t.cancelled ? "cancel" : ""}" data-id="${esc(t.id)}">

      </span>

function trendSVG(m) {
  const months = Array.from({ length: 6 }, (_, k) => shiftMonth(m, k - 5));
  const data = months.map(mm => {
    const live = state.tx.filter(t => ym(t.date) === mm && !t.cancelled);
    const parts = PAYERS.map(p => live.filter(t => t.payer === p.name).reduce((s, t) => s + t.total, 0));
    const all = live.reduce((s, t) => s + t.total, 0);
    return { mm, parts, rest: all - parts.reduce((a, b) => a + b, 0), all };
  });
  const max = Math.max(1, ...data.map(d => d.all));
  const W = 320, H = 150, top = 18, base = 120, bw = 30, gap = (W - bw * 6) / 6;
  let g = "";
  data.forEach((d, i) => {
    const x = gap / 2 + i * (bw + gap);
    let y = base;
    const segs = [...d.parts.map((v, k) => [v, PAYERS[k].color]), [d.rest, "var(--other)"]];
    for (const [v, c] of segs) {
      if (v <= 0) continue;
      const h = v / max * (base - top);
      y -= h;
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" style="fill:${c}"></rect>`;
    }
    const cur = d.mm === m ? "cur" : "";
    g += `<text x="${x + bw / 2}" y="${base + 16}" text-anchor="middle" class="${cur}">${Number(d.mm.slice(5))}월</text>`;
    if (d.all) g += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" class="${cur}">${d.all >= 10000 ? Math.round(d.all / 10000) + "만" : won(d.all)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 월별 지출">${g}<line x1="0" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--line)"></line></svg>`;
}

// ---------------------------------------------------------------- 카드 · 청구서
// 카드 설정은 private repo 의 cards.json 에 저장된다.
// { id, name, owner, keys: ["삼성|5492", ...], pay_day, start: {m:-1, d:1}, end: {m:-1, d:31} }
//   start/end.m : 결제월 기준 몇 달 전(-2 전전월, -1 전월, 0 당월), d=31 은 "말일"
const ISSUERS = ["KB국민", "국민", "신한", "삼성", "현대", "롯데", "우리", "하나", "NH농협", "농협", "BC", "비씨", "씨티", "카카오뱅크", "케이뱅크", "토스", "IBK", "기업"];
function normIssuer(s) {
  s = String(s || "").replace(/\s/g, "");
  const hit = ISSUERS.find(i => s.includes(i));
  return hit ? hit.replace(/^국민$/, "KB국민").replace(/^농협$/, "NH농협").replace(/^비씨$/, "BC").replace(/^기업$/, "IBK") : (s.replace(/카드.*$/, "") || "");
}
const cardKey = t => {
  const iss = normIssuer(t.card_issuer);
  if (!iss && !t.card_last4) return null;
  return `${iss || "카드"}|${t.card_last4 || "????"}`;
};
const keyLabel = k => { const [i, l] = k.split("|"); return `${i}카드 ${l === "????" ? "(번호 없음)" : "…" + l}`; };
const DEFAULT_CARD = { pay_day: 14, start: { m: -1, d: 1 }, end: { m: -1, d: 31 } };

async function loadCards() {
  try {
    const f = await api("GET", `/contents/cards.json?ref=${BRANCH}`);
    const bytes = Uint8Array.from(atob(f.content.replace(/\n/g, "")), c => c.charCodeAt(0));
    state.cards = JSON.parse(new TextDecoder().decode(bytes)).cards || [];
    state.cardsSha = f.sha;
  } catch (e) { if (e.status === 404) { state.cards = []; state.cardsSha = null; } else throw e; }
}
async function saveCards(message) {
  const content = b64utf8(JSON.stringify({ cards: state.cards }, null, 2) + "\n");
  const r = await api("PUT", "/contents/cards.json", { message, content, sha: state.cardsSha || undefined, branch: BRANCH });
  state.cardsSha = r.content.sha;
}

// 날짜 도우미 (문자열 YYYY-MM-DD, 달 넘김·말일 처리)
const pad2 = n => String(n).padStart(2, "0");
function ymd(y, m, d) { const last = new Date(y, m, 0).getDate(); return `${y}-${pad2(m)}-${pad2(Math.min(d, last))}`; }
function addMonths(y, m, k) { const t = new Date(y, m - 1 + k, 1); return [t.getFullYear(), t.getMonth() + 1]; }
const todayStr = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };

// 결제월(y,m)의 청구서: 결제일과 이용기간
function statement(card, y, m) {
  const c = { ...DEFAULT_CARD, ...card };
  const [sy, sm] = addMonths(y, m, c.start.m), [ey, em] = addMonths(y, m, c.end.m);
  return { y, m, pay: ymd(y, m, c.pay_day), from: ymd(sy, sm, c.start.d), to: ymd(ey, em, c.end.d) };
}
// 사용일이 속한 청구서의 결제월
function payMonthOf(card, date) {
  const [y, m] = date.split("-").map(Number);
  for (let k = -1; k <= 4; k++) {
    const [py, pm] = addMonths(y, m, k), st = statement(card, py, pm);
    if (date >= st.from && date <= st.to) return [py, pm];
  }
  return null;
}
const monthsBetween = (a, b) => (b[0] - a[0]) * 12 + (b[1] - a[1]);
const cardTx = card => state.tx.filter(t => !t.cancelled && card.keys.includes(cardKey(t)));

// 결제월(y,m) 청구 예상액: 일시불은 사용일이 그 이용기간에 있으면 전액,
// 할부 N개월은 첫 청구서부터 N번에 나눠 (원금만, 할부 수수료 제외)
function bill(card, y, m) {
  const st = statement(card, y, m), lines = [];
  for (const t of cardTx(card)) {
    const pm = payMonthOf(card, t.date); if (!pm) continue;
    const n = Number((t.installment || "").match(/(\d+)\s*개월/)?.[1] || 1);
    const k = monthsBetween(pm, [y, m]);
    if (k < 0 || k >= n) continue;
    const base = Math.floor(t.total / n), amt = k === 0 ? t.total - base * (n - 1) : base;
    lines.push({ t, amt, note: n > 1 ? `할부 ${k + 1}/${n}회` : "" });
  }
  lines.sort((a, b) => (a.t.date + a.t.time).localeCompare(b.t.date + b.t.time));
  return { ...st, total: lines.reduce((s, l) => s + l.amt, 0), lines };
}
// 다가오는 청구서 두 개: 이번 결제(이용기간 마감) + 다음 결제(사용 중)
function upcoming(card) {
  const today = todayStr(), [y, m] = today.split("-").map(Number);
  const out = [];
  for (let k = -1; k <= 3 && out.length < 2; k++) {
    const [py, pm] = addMonths(y, m, k), b = bill(card, py, pm);
    if (b.pay >= today) out.push({ ...b, closed: b.to < today });
  }
  return out;
}
const md = s => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}`;
const periodText = c => {
  const mm = { "-2": "전전월", "-1": "전월", "0": "당월" }, dd = d => d >= 31 ? "말일" : `${d}일`;
  c = { ...DEFAULT_CARD, ...c };
  return `매월 ${c.pay_day}일 결제 · 이용기간 ${mm[c.start.m]} ${dd(c.start.d)} ~ ${mm[c.end.m]} ${dd(c.end.d)}`;
};

function cardsHTML() {
  const detected = {};
  for (const t of state.tx) { const k = cardKey(t); if (!k || t.cancelled) continue; (detected[k] ||= { n: 0, v: 0, payer: t.payer }).n++; detected[k].v += t.total; }
  const assigned = new Set(state.cards.flatMap(c => c.keys));
  const unassigned = Object.keys(detected).filter(k => !assigned.has(k));
  const noCard = state.tx.filter(t => !t.cancelled && !cardKey(t)).length;
  // 상단 요약: 카드마다 다가오는 첫 결제 합계 + 카드별 막대(이번 결제 진하게, 그다음 결제 옅게)
  const summary = state.cards.map(c => { const u = upcoming(c); return { c, first: u[0], second: u[1] }; })
    .filter(x => x.first).sort((a, b) => a.first.pay.localeCompare(b.first.pay));
  const sumFirst = summary.reduce((s, x) => s + x.first.total, 0);
  const sumSecond = summary.reduce((s, x) => s + (x.second ? x.second.total : 0), 0);
  const maxV = Math.max(1, ...summary.map(x => x.first.total + (x.second ? x.second.total : 0)));
  const ownerColor = c => (PAYERS.find(p => p.name === c.owner) || {}).color || "var(--other)";
  const payDates = summary.map(x => x.first.pay).sort();
  const heroHTML = summary.length ? `
    <div class="chero">
      <div class="l">다가오는 카드 결제 예정 합계${payDates.length ? ` · ${md(payDates[0])}${payDates.length > 1 && payDates[payDates.length - 1] !== payDates[0] ? " ~ " + md(payDates[payDates.length - 1]) : ""} 결제` : ""}</div>
      <div class="total">${won(sumFirst)}<small>원</small></div>
      <div class="sub2">그다음 결제(사용 중) ${won(sumSecond)}원 · 카드 ${summary.length}장</div>
    </div>
    <div class="cchart" role="img" aria-label="카드별 결제 예정 금액">
      ${summary.map(x => {
        const col = ownerColor(x.c), w1 = x.first.total / maxV * 100, w2 = (x.second ? x.second.total : 0) / maxV * 100;
        return `<button class="crow" data-bill="${esc(x.c.id)}" data-k="0">
          <span class="n"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${col};flex:none"></span>${esc(x.c.name)}</span>
          <span class="v">${won(x.first.total)}원</span>
          <span class="bar"><i style="width:${w1}%;background:${col}"></i><i style="width:${w2}%;background:${col};opacity:.35"></i></span>
          <span class="d">${md(x.first.pay)} 결제 ${won(x.first.total)}원${x.second ? ` · ${md(x.second.pay)} 결제 ${won(x.second.total)}원 (사용 중)` : ""}</span>
        </button>`;
      }).join("")}
      <div class="legend">${PAYERS.map(p => `<span><i style="background:${p.color}"></i>${p.name}</span>`).join("")}<span><i style="background:var(--other)"></i>공용</span><span><i style="background:var(--ink);opacity:.35"></i>옅은 색 = 그다음 결제</span></div>
    </div>` : "";
  const cards = state.cards.map(c => {
    const ups = upcoming(c), p = PAYERS.find(p => p.name === c.owner);
    return `<div class="card">
      <div class="head">
        <div><div class="nm">${p ? `<span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p.color};margin-right:6px"></span>` : ""}${esc(c.name)}</div>
          <div class="sub">${esc(periodText(c))}${c.defaults ? " (기본값)" : ""}</div>

      </div>

        <span class="l">${md(b.pay)} 결제 예정 ${b.closed ? "(이용기간 마감)" : b.from > todayStr() ? "(다음 이용기간)" : "(사용 중)"}</span><span class="v">${won(b.total)}원</span>

  return `

    ${noCard ? `<div class="unk">카드 정보가 없는 기록 ${noCard}건은 청구서 계산에서 빠져요 (현금·계좌이체 등).</div>` : ""}

function openCardEditor(id, newKey) {
  const existing = id ? state.cards.find(c => c.id === id) : null;
  const detectedKeys = [...new Set(state.tx.map(cardKey).filter(Boolean))];
  const assignedElsewhere = new Set(state.cards.filter(c => c !== existing).flatMap(c => c.keys));
  const guessOwner = newKey ? (state.tx.find(t => cardKey(t) === newKey) || {}).payer : null;
  const c = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: "c" + Date.now().toString(36), name: newKey ? keyLabel(newKey) : "새 카드", owner: guessOwner || null,
    keys: newKey ? [newKey] : [], ...JSON.parse(JSON.stringify(DEFAULT_CARD)) };
  const opt = (v, cur, label) => `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${label}</option>`;
  const days = sel => Array.from({ length: 31 }, (_, i) => opt(i + 1, sel, i + 1 === 31 ? "말일" : `${i + 1}일`)).join("");
  const months = (sel, allowed) => allowed.map(m => opt(m, sel, { "-2": "전전월", "-1": "전월", "0": "당월" }[m])).join("");
  $("#sheetBody").innerHTML = `
    <header><h3>${existing ? "카드 정보 수정" : "카드 등록"}</h3><button class="iconbtn" id="close" aria-label="닫기">✕</button></header>
    <div class="form">
      <div><label for="cname">별칭</label><input type="text" id="cname" value="${esc(c.name)}" placeholder="예: 미니 삼성 아멕스"></div>
      <div><label>사용자</label><div class="line">
        ${PAYERS.map(p => `<button class="chip" data-owner="${p.name}" aria-pressed="${c.owner === p.name}">${p.name}</button>`).join("")}
        <button class="chip" data-owner="" aria-pressed="${!c.owner}">공용</button></div></div>
      <div><label for="payday">결제일</label><div class="line">매월 <select id="payday">${Array.from({ length: 31 }, (_, i) => opt(i + 1, c.pay_day, i + 1)).join("")}</select> 일</div></div>
      <div><label>이용기간</label><div class="line">
        <select id="sm">${months(c.start.m, [-2, -1, 0])}</select><select id="sd">${days(c.start.d)}</select> ~
        <select id="em">${months(c.end.m, [-1, 0])}</select><select id="ed">${days(c.end.d)}</select></div>
        <div class="hint" id="preview" style="margin-top:6px;color:var(--ink)"></div>
        <div class="hint" style="margin-top:4px">카드사 앱이나 청구서의 "이용기간"을 그대로 옮기세요. 예: 25일 결제 → 전월 14일 ~ 당월 13일</div></div>
      <div class="keys"><label>이 카드로 묶을 기록</label>
        ${detectedKeys.filter(k => !assignedElsewhere.has(k)).map(k => `<label><input type="checkbox" value="${esc(k)}" ${c.keys.includes(k) ? "checked" : ""}> ${esc(keyLabel(k))}</label>`).join("") || `<div class="hint">묶을 수 있는 기록이 없어요.</div>`}
        <div class="hint">간편결제(GS페이 등)는 문자와 영수증의 끝자리가 다르게 찍혀요. 같은 카드면 함께 체크하세요.</div></div>
      <button class="primary" id="csave">저장</button>
      ${existing ? `<button class="danger" id="cdel">이 카드 삭제</button>` : ""}
      <div class="up-msg" id="cmsg"></div>
    </div>`;
  const dlg = $("#sheet"); dlg.showModal();
  $("#close").onclick = () => dlg.close();
  dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
  document.querySelectorAll("[data-owner]").forEach(b => b.onclick = () => {
    c.owner = b.dataset.owner || null; document.querySelectorAll("[data-owner]").forEach(x => x.setAttribute("aria-pressed", (x.dataset.owner || null) === c.owner));
  });
  // 입력값으로 다음 청구서를 미리 계산해 보여준다. 시작일이 종료일보다 뒤인데 같은 달이면 종료를 다음 달로 맞춘다
  const readForm = () => ({ pay_day: Number($("#payday").value),
    start: { m: Number($("#sm").value), d: Number($("#sd").value) }, end: { m: Number($("#em").value), d: Number($("#ed").value) } });
  const refresh = (changed) => {
    let f = readForm();
    if (["sm", "sd", "ed"].includes(changed) && f.end.m <= f.start.m && f.end.d < f.start.d && f.start.m + 1 <= 0) {
      $("#em").value = String(f.start.m + 1); f = readForm();
    }
    const t = todayStr().split("-").map(Number), [py, pm] = addMonths(t[0], t[1], 1), st = statement(f, py, pm);
    const days = (new Date(st.to) - new Date(st.from)) / 864e5 + 1;
    const bad = st.from > st.to || days < 27 || days > 32;
    $("#preview").innerHTML = bad
      ? `<span style="color:var(--bad)">이용기간이 이상해요: ${md(st.from)} ~ ${md(st.to)} (${Math.max(0, days)}일). 시작·종료 달을 확인하세요.</span>`
      : `미리보기: ${md(st.pay)} 결제 → ${md(st.from)} ~ ${md(st.to)} 사용분`;
    return !bad;
  };
  ["payday", "sm", "sd", "em", "ed"].forEach(id => $("#" + id).onchange = () => refresh(id));
  refresh();
  const persist = async (mutate, msg) => {
    $("#cmsg").textContent = "저장 중…";
    try {
      await loadCards();                 // 다른 기기에서 바꾼 내용 위에 반영
      mutate(); await saveCards(msg);
      dlg.close(); render();
    } catch (e) { $("#cmsg").textContent = `저장하지 못했어요: ${e.message}`; }
  };
  $("#csave").onclick = () => {
    c.name = $("#cname").value.trim() || keyLabel(c.keys[0] || "카드|????");
    c.pay_day = Number($("#payday").value);
    c.start = { m: Number($("#sm").value), d: Number($("#sd").value) };
    c.end = { m: Number($("#em").value), d: Number($("#ed").value) };
    c.keys = [...document.querySelectorAll(".keys input:checked")].map(i => i.value);
    delete c.defaults;
    if (!refresh()) { $("#cmsg").textContent = "이용기간을 먼저 바로잡아 주세요."; return; }
    if (!c.keys.length) { $("#cmsg").textContent = "묶을 기록을 하나 이상 체크해 주세요."; return; }
    persist(() => { state.cards = state.cards.filter(x => x.id !== c.id).concat([c]); }, `cards: ${c.name} ${existing ? "수정" : "등록"}`);
  };
  if (existing) $("#cdel").onclick = () => {
    if (confirm(`${c.name} 카드를 삭제할까요? 가계부 기록은 그대로 남아요.`)) persist(() => { state.cards = state.cards.filter(x => x.id !== c.id); }, `cards: ${c.name} 삭제`);
  };
}

// ---------------------------------------------------------------- 영수증 올리기
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
async function api(method, path, body) {
  const r = await fetch(API + path, { method, cache: "no-store",
    headers: { Authorization: `Bearer ${state.token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((data && data.message) || `HTTP ${r.status}`), { status: r.status });
  return data;
}

// 처리 대기 중인 사진과 실패한 사진(사유 포함)
async function loadInbox() {
  const out = { pending: 0, failed: [] };
  try {
    const list = await api("GET", `/contents/inbox/receipts?ref=${BRANCH}`);
    out.pending = list.filter(f => f.type === "file" && /\.(jpe?g|png|webp|heic)$/i.test(f.name)).length;
  } catch (e) { if (e.status !== 404) throw e; }
  try {
    const list = await api("GET", `/contents/inbox/receipts/failed?ref=${BRANCH}`);
    for (const f of list.filter(f => f.name.endsWith(".error.json"))) {
      try { const e = JSON.parse(await gh(f.path)); out.failed.push({ name: f.name.replace(".error.json", ""), reason: e.reason, at: e.at }); } catch (e) {}
    }
  } catch (e) { if (e.status !== 404) throw e; }
  return out;
}

function pendingHTML() {
  const { pending, failed } = state.inbox || { pending: 0, failed: [] };
  if (!pending && !failed.length) return "";
  return `<div class="pending">
    ${pending ? `<div>영수증 <b>${pending}장</b> 읽는 중이에요. 보통 2~3분 뒤 ↻ 를 누르면 보여요.</div>` : ""}
    ${failed.map(f => `<div class="fail">못 읽은 사진 (${esc((f.at || "").slice(5, 16).replace("T", " "))}): ${esc(shortReason(f.reason))}</div>`).join("")}
  </div>`;
}
function shortReason(r) {
  r = String(r || "");
  if (r.startsWith("중복")) return "이미 기록된 영수증이에요";
  if (r.startsWith("검증 실패")) return "날짜·가맹점·금액을 읽지 못했어요. 더 밝고 선명하게 다시 찍어 주세요";
  return r.slice(0, 80);
}

// 사진을 회전 보정 + 긴 변 2400px JPEG 로 줄여 올린다 (위치정보 등 EXIF 도 이때 사라짐)
async function toJpeg(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(async () => {
    const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); return img;
  });
  const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
}
const b64 = buf => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const b64utf8 = str => b64(new TextEncoder().encode(str));

// 사진과 메타(결제자·메모)를 한 커밋으로 올린다 → receipt-ingest Action 이 처리
async function commitReceipt(jpeg, meta) {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const name = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${Math.random().toString(36).slice(2, 8)}`;
  const img = await api("POST", "/git/blobs", { content: b64(await jpeg.arrayBuffer()), encoding: "base64" });
  const mj = await api("POST", "/git/blobs", { content: b64utf8(JSON.stringify(meta, null, 2) + "\n"), encoding: "base64" });
  for (let i = 0; i < 4; i++) {
    const ref = await api("GET", `/git/ref/heads/${BRANCH}`);
    const head = await api("GET", `/git/commits/${ref.object.sha}`);
    const tree = await api("POST", "/git/trees", { base_tree: head.tree.sha, tree: [
      { path: `inbox/receipts/${name}.jpg`, mode: "100644", type: "blob", sha: img.sha },
      { path: `inbox/receipts/${name}.json`, mode: "100644", type: "blob", sha: mj.sha },
    ] });
    const c = await api("POST", "/git/commits", { message: `upload: 영수증 (${meta.payer || "결제자 미지정"})`, tree: tree.sha, parents: [ref.object.sha] });
    try { await api("PATCH", `/git/refs/heads/${BRANCH}`, { sha: c.sha, force: false }); return name; }
    catch (e) { if (e.status !== 422) throw e; await new Promise(r => setTimeout(r, 1200 * (i + 1))); }
  }
  throw new Error("다른 기록과 겹쳐서 올리지 못했어요. 다시 시도해 주세요");
}

function openUpload() {
  let lastPayer = null; try { lastPayer = localStorage.getItem("ledger.payer"); } catch (e) {}
  let payer = lastPayer || PAYERS[0].name, file = null;
  $("#sheetBody").innerHTML = `
    <header><h3>영수증 올리기</h3><button class="iconbtn" id="close" aria-label="닫기">✕</button></header>
    <label class="up-drop" id="drop">
      <input type="file" accept="image/*" id="file" hidden>
      <span id="dropText">여기를 눌러 사진을 찍거나 고르세요</span>
    </label>
    <div class="up-row"><label>결제자</label>
      ${PAYERS.map(p => `<button class="chip" data-p="${p.name}" aria-pressed="${p.name === payer}">${p.name}</button>`).join("")}
    </div>
    <input class="up-memo" id="memo" placeholder="메모 (선택) 예: 아이 준비물">
    <button class="primary" id="send" disabled>올리기</button>
    <div class="up-msg" id="msg">올린 뒤 2~3분이면 품목·분류까지 자동으로 정리돼요.</div>`;
  const dlg = $("#sheet"); dlg.showModal();
  $("#close").onclick = () => dlg.close();
  dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    payer = b.dataset.p; document.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-pressed", x.dataset.p === payer));
  });
  $("#file").onchange = e => {
    file = e.target.files[0]; if (!file) return;
    $("#dropText").innerHTML = `<img alt="선택한 영수증" src="${URL.createObjectURL(file)}">`;
    $("#send").disabled = false;
  };
  $("#send").onclick = async () => {
    const btn = $("#send"); btn.disabled = true; $("#msg").textContent = "사진 줄이는 중…";
    try {
      const jpeg = await toJpeg(file);
      $("#msg").textContent = "올리는 중…";
      await commitReceipt(jpeg, { payer, memo: $("#memo").value.trim() || null, original_filename: file.name,
        uploaded_at: new Date().toISOString() });
      try { localStorage.setItem("ledger.payer", payer); } catch (e) {}
      state.inbox.pending = (state.inbox.pending || 0) + 1;
      dlg.close(); render();
    } catch (e) {
      btn.disabled = false;
      $("#msg").textContent = e.status === 403 || e.status === 404
        ? "이 토큰은 쓰기 권한이 없어요. 쓰기 권한 토큰으로 다시 로그인해 주세요."
        : `올리지 못했어요: ${e.message}`;
    }
  };
}
